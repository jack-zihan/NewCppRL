[build-system]
requires = ["setuptools", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["envs*", "rl*"]

[project]
name = "cpp_rl"
version = "0.1.0"
authors = [
    { name = "0Pinky0", email = "lpinkyl@126.com" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # ── PyTorch 栈(torch 默认 PyPI wheel 自带 CUDA;别的 CUDA 见 README「环境部署」)──
    "torch == 2.12.0",
    "torchvision == 0.27.0",
    "torchcodec == 0.13.0",     # 视频写盘后端(torchrl 0.12 用它替代已移除的 torchvision.io.write_video)
    "tensordict == 0.12.4",
    "triton == 3.7.0",
    # 注意:torchrl *不*在此(也不进 uv.lock)—— 它的 C++ 扩展须对齐已装 torch 的 ABI 现编,
    #       uv lock 在 metadata 阶段拿不到 torch/setuptools(鸡生蛋)。改为 `uv sync` 后的源码步骤,见 README。
    # ── 数值 / RL / 环境 ──
    "numpy == 2.4.6",
    "gymnasium == 1.3.0",
    "dubins @ git+https://github.com/rdesc/pydubins.git",
    "cupy-cuda13x == 14.1.0",   # 绑定 CUDA 13.x(旧 cupy-cuda12x 对应 CUDA 12)
    "shapely == 2.1.2",
    # ── 配置 / 日志 / 可视化 ──
    "hydra-core == 1.3.2",      # 项目用 Hydra 管理实验(原 pyproject 漏写)
    "omegaconf == 2.3.0",
    "wandb == 0.27.0",
    "tensorboard == 2.20.0",
    "matplotlib == 3.10.9",
    "opencv-python == 4.13.0.92",
    "moviepy == 2.2.1",
    "av == 15.1.0",
    "pygame == 2.6.1",
    "pandas == 3.0.3",
    "scipy == 1.17.1",
    "tqdm == 4.67.3",
    "pytest == 9.0.3",          # 项目测试用;且 cupy.testing 惰性 import pytest,缺失会在某些 import 组合下崩
]

[tool.pytest.ini_options]
# 禁用ROS2的所有插件，避免依赖冲突
addopts = """
    -p no:launch_testing
    -p no:launch_testing_ros
    -p no:ament_pep257
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_xmllint
"""
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ── uv 管理(默认环境;py3.14 新栈)──
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true   # 仅 torch/torchvision 用它(下面 sources 显式指定),其余走 PyPI

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv.extra-build-dependencies]
# dubins 的 git 源在 py≥3.13 必须用 cython 重新生成 .c(否则仓库里过时的预生成 .c 编不过)。
dubins = ["setuptools", "cython", "numpy"]
