[build-system]
requires = ["setuptools", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["envs*", "rl*"]

[project]
name = "cpp_rl"
version = "0.1.0"
authors = [
    { name = "0Pinky0", email = "lpinkyl@126.com" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # ── PyTorch 栈(torch 默认 PyPI wheel 自带 CUDA;别的 CUDA 见 README「环境部署」)──
    "torch == 2.15.0",
    "torchvision == 0.29.1",
    "torchcodec == 0.17.0",     # 视频写盘后端(torchrl 用它替代已移除的 torchvision.io.write_video)
    "triton == 3.9.0",
    # 注意:torchrl 和 tensordict *都不*在此(也不进 uv.lock)—— 它们的 C++ 扩展须对齐已装 torch 的 ABI 现编;
    #       且 tensordict 0.13.0 PyPI 还没 wheel、只有 git 源,uv lock 在 metadata 阶段拿不到 torch/setuptools(鸡生蛋)。
    #       二者都改为 `uv sync` 后的源码步骤(见 README)。⚠️把 tensordict 写回 lock 只会让 uv run/sync 反复把它退回旧 wheel。
    # ── 数值 / RL / 环境 ──
    "numpy == 2.5.4",
    "gymnasium == 1.4.0",
    "dubins @ git+https://github.com/rdesc/pydubins.git",
    "cupy-cuda13x == 14.2.0",   # 绑定 CUDA 13.x(旧 cupy-cuda12x 对应 CUDA 12)
    "shapely == 2.2.0",
    # ── 配置 / 日志 / 可视化 ──
    "hydra-core == 1.3.8",      # 项目用 Hydra 管理实验(原 pyproject 漏写)
    "omegaconf == 2.3.1",
    "wandb == 0.31.0",
    "tensorboard == 2.21.0",
    "matplotlib == 3.11.2",
    "opencv-python == 5.0.0.93",
    "moviepy == 2.2.1",
    "av == 19.0.2",
    "pygame == 2.6.1",
    "pandas == 3.1.0",
    "scipy == 1.18.1",
    "tqdm == 4.70.1",
    "pytest == 9.2.0",          # 项目测试用;且 cupy.testing 惰性 import pytest,缺失会在某些 import 组合下崩
    "scipy-stubs~=1.18.1",
]

[tool.pytest.ini_options]
# 禁用ROS2的所有插件，避免依赖冲突
addopts = """
    -p no:launch_testing
    -p no:launch_testing_ros
    -p no:ament_pep257
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_xmllint
"""
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ── uv 管理(默认环境;py3.14 新栈)──
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true   # 仅 torch/torchvision 用它(下面 sources 显式指定),其余走 PyPI

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[tool.uv.extra-build-dependencies]
# dubins 的 git 源在 py≥3.13 必须用 cython 重新生成 .c(否则仓库里过时的预生成 .c 编不过)。
dubins = ["setuptools", "cython", "numpy"]
